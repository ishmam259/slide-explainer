[project]
name = "slidex"
version = "0.1.0"
description = "Slide Explainer backend: understands slides, researches sources, generates cited explanations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.40",
    "sse-starlette>=3.5",
    "openai>=3.22",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pymupdf>=1.28",
    "python-pptx>=1.0.2",
    "pillow>=12.3",
    "numpy>=2.5",
    "scikit-learn>=1.9",
    "tiktoken>=0.14",
    "httpx>=0.28",
    "trafilatura>=2.2",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2",
    "python-docx>=1.2",
    "playwright>=1.63",
    "python-ulid>=3.0",
    "typer>=0.16",
]

[project.optional-dependencies]
gpu = ["rapidocr>=3.9", "onnxruntime-gpu>=1.30"]
cpu-ocr = ["rapidocr>=3.9", "onnxruntime>=1.30"]

[project.scripts]
slidex = "slidex.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.16",
    "mypy>=2.3",
    "pyyaml>=6.0",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slidex"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
# RUF001-003: typographic characters (›, ≤, –) are deliberate in user-facing text.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["slidex"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships incomplete type hints; calls into it are checked by tests instead.
module = [
    "slidex.books.parse",
    "slidex.books.figures",
    "slidex.research.fetch",
    "slidex.intake.*",
    "slidex.api.research",
]
disallow_untyped_calls = false

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
